<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1200" viewBox="0 0 1100 1200" role="img" aria-labelledby="title desc">
  <title id="title">tierbuf degradation curve — i4i.large reference run</title>
  <desc id="desc">Measured throughput and p99 latency across DRAM fractions 1.0 to 0.1 on i4i.large, run 20260730-164346-i4i-large, plus a normalized comparison against the pre-run placeholder shape.</desc>
  <rect width="1100" height="1200" rx="18" fill="#0f172a"/>
  <text x="50" y="56" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">tierbuf degradation curve</text>
  <text x="50" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">i4i.large reference run, 8192 MiB dataset, 30s measurement (run 20260730-164346-i4i-large).</text>

  <!-- Panel 1: throughput -->
  <text x="50" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Throughput (ops/s)</text>
  <text x="50" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Fraction 1.0 &#8594; 0.8 alone costs 49% of peak throughput, then the curve flattens through 0.1.</text>

  <line x1="110" y1="182.94" x2="1040" y2="182.94" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="234.71" x2="1040" y2="234.71" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="286.47" x2="1040" y2="286.47" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="338.24" x2="1040" y2="338.24" stroke="#1e293b" stroke-width="1"/>

  <text x="100" y="186.94" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">80k</text>
  <text x="100" y="238.71" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">60k</text>
  <text x="100" y="290.47" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">40k</text>
  <text x="100" y="342.24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">20k</text>
  <text x="100" y="394" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">0</text>

  <line x1="110" y1="390" x2="1040" y2="390" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="170" x2="110" y2="390" stroke="#64748b" stroke-width="2"/>

  <polyline points="150,175.47 326,281.27 502,327.17 678,344.87 854,355.30 1030,360.31"
            fill="none" stroke="#3987e5" stroke-width="3"/>
  <g fill="#3987e5">
    <circle cx="150" cy="175.47" r="6"/><circle cx="326" cy="281.27" r="6"/><circle cx="502" cy="327.17" r="6"/>
    <circle cx="678" cy="344.87" r="6"/><circle cx="854" cy="355.30" r="6"/><circle cx="1030" cy="360.31" r="6"/>
  </g>
  <text x="164" y="179.47" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">82.9k ops/s</text>
  <text x="1030" y="376.31" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">11.5k ops/s</text>

  <text x="30" y="280" transform="rotate(-90 30 280)" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ops/s</text>

  <!-- Panel 2: p99 latency -->
  <text x="50" y="450" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">p99 latency (&#181;s)</text>
  <text x="50" y="470" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Effectively flat from fraction 0.8 through 0.1 &#8212; the NVMe device, not the kernel, bounds the tail there.</text>

  <line x1="110" y1="502.94" x2="1040" y2="502.94" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="554.71" x2="1040" y2="554.71" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="606.47" x2="1040" y2="606.47" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="658.24" x2="1040" y2="658.24" stroke="#1e293b" stroke-width="1"/>

  <text x="100" y="506.94" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">1600</text>
  <text x="100" y="558.71" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">1200</text>
  <text x="100" y="610.47" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">800</text>
  <text x="100" y="662.24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">400</text>
  <text x="100" y="714" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">0</text>

  <line x1="110" y1="710" x2="1040" y2="710" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="490" x2="110" y2="710" stroke="#64748b" stroke-width="2"/>

  <polyline points="150,507.09 326,592.58 502,597.29 678,598.73 854,599.59 1030,599.86"
            fill="none" stroke="#eb6834" stroke-width="3"/>
  <g fill="#eb6834">
    <circle cx="150" cy="507.09" r="6"/><circle cx="326" cy="592.58" r="6"/><circle cx="502" cy="597.29" r="6"/>
    <circle cx="678" cy="598.73" r="6"/><circle cx="854" cy="599.59" r="6"/><circle cx="1030" cy="599.86" r="6"/>
  </g>
  <text x="164" y="511.09" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">1568 &#181;s</text>
  <text x="326" y="577" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">907 &#181;s</text>
  <text x="1030" y="615.86" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">851 &#181;s</text>

  <text x="30" y="600" transform="rotate(-90 30 600)" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">&#181;s</text>

  <!-- shared x-axis labels -->
  <text x="150" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">1.0</text>
  <text x="326" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.8</text>
  <text x="502" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.6</text>
  <text x="678" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.4</text>
  <text x="854" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.2</text>
  <text x="1030" y="734" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.1</text>
  <text x="575" y="762" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">DRAM fraction</text>

  <!-- Panel 3: measured vs. pre-run placeholder shape -->
  <text x="50" y="812" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Measured vs. placeholder shape (normalized to fraction 1.0)</text>
  <text x="50" y="832" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">The placeholder assumed a steady, near-linear decline; the measured curve front-loads most of its loss into the first step.</text>

  <line x1="50" y1="852" x2="74" y2="852" stroke="#3987e5" stroke-width="3"/>
  <text x="80" y="856" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Measured (i4i.large)</text>
  <line x1="280" y1="852" x2="304" y2="852" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="310" y="856" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Placeholder shape (illustrative, pre-run)</text>

  <line x1="110" y1="927" x2="1040" y2="927" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="982" x2="1040" y2="982" stroke="#1e293b" stroke-width="1"/>
  <line x1="110" y1="1037" x2="1040" y2="1037" stroke="#1e293b" stroke-width="1"/>

  <text x="100" y="876" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">100%</text>
  <text x="100" y="931" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">75%</text>
  <text x="100" y="986" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">50%</text>
  <text x="100" y="1041" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">25%</text>
  <text x="100" y="1096" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">0%</text>

  <line x1="110" y1="1092" x2="1040" y2="1092" stroke="#64748b" stroke-width="2"/>
  <line x1="110" y1="872" x2="110" y2="1092" stroke="#64748b" stroke-width="2"/>

  <polyline points="150,897.10 326,930.34 502,968.27 678,1008.82 854,1041.45 1030,1051.45"
            fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="#94a3b8">
    <circle cx="150" cy="897.10" r="5.5"/><circle cx="326" cy="930.34" r="5.5"/><circle cx="502" cy="968.27" r="5.5"/>
    <circle cx="678" cy="1008.82" r="5.5"/><circle cx="854" cy="1041.45" r="5.5"/><circle cx="1030" cy="1051.45" r="5.5"/>
  </g>

  <polyline points="150,872.00 326,980.50 502,1027.57 678,1045.72 854,1056.41 1030,1061.56"
            fill="none" stroke="#3987e5" stroke-width="3"/>
  <g fill="#3987e5">
    <circle cx="150" cy="872.00" r="6"/><circle cx="326" cy="980.50" r="6"/><circle cx="502" cy="1027.57" r="6"/>
    <circle cx="678" cy="1045.72" r="6"/><circle cx="854" cy="1056.41" r="6"/><circle cx="1030" cy="1061.56" r="6"/>
  </g>

  <text x="340" y="901.10" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">89%</text>
  <text x="340" y="984.50" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">51%</text>
  <text x="1030" y="1035" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">18%</text>
  <text x="1030" y="1077.56" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">14%</text>

  <text x="30" y="982" transform="rotate(-90 30 982)" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">% of peak</text>

  <text x="150" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">1.0</text>
  <text x="326" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.8</text>
  <text x="502" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.6</text>
  <text x="678" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.4</text>
  <text x="854" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.2</text>
  <text x="1030" y="1116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0.1</text>
  <text x="575" y="1144" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">DRAM fraction</text>
</svg>
