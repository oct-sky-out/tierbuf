[workspace]
members = [
    "crates/tierbuf",
    "crates/tierbuf-bench",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/oct-sky-out/tierbuf"

[workspace.dependencies]
criterion = "0.5"
crc32fast = "1"
crossbeam-queue = "0.3"
io-uring = "0.7"
libc = "0.2"
lz4_flex = "0.11"
hmac = "0.12"
metrics = "0.24"
proptest = "1.6"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tierbuf = { path = "crates/tierbuf" }
ureq = "3"
